spring.datasource.url=jdbc:h2:mem:autoescola-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=testSecretKeyForJwtSigningInTestsOnlyMinimum32Bytes
jwt.expiration-ms=7200000

admin.default.username=admin
admin.default.senha=Admin@123
