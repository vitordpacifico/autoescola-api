# Perfil opcional com PostgreSQL. Ativar com: -Dspring.profiles.active=postgres
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoescola}
spring.datasource.username=${DB_USER:autoescola}
spring.datasource.password=${DB_PASSWORD:autoescola}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
