spring.application.name=autoescola-api
spring.profiles.active=dev

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:autoEscolaCp4SecretDevOnlyTrocarEmProducao1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.senha=${ADMIN_DEFAULT_SENHA:Admin@123}

autoescola.agendamento.abertura=06:00
autoescola.agendamento.fechamento=21:00
autoescola.agendamento.duracao-minutos=60
autoescola.agendamento.antecedencia-minima-minutos=30
autoescola.agendamento.max-instrucoes-por-aluno-dia=2
autoescola.cancelamento.antecedencia-minima-horas=24

autoescola.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br/ws}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s

autoescola.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
autoescola.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
autoescola.cors.allowed-headers=Authorization,Content-Type,Accept
autoescola.cors.exposed-headers=Location
autoescola.cors.allow-credentials=false
autoescola.cors.max-age-seconds=3600

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
