spring.application.name=autoescola-api
spring.profiles.active=dev

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:autoEscolaCp4SecretDevOnlyTrocarEmProducao1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.senha=${ADMIN_DEFAULT_SENHA:Admin@123}

autoescola.agendamento.abertura=06:00
autoescola.agendamento.fechamento=21:00
autoescola.agendamento.duracao-minutos=60
autoescola.agendamento.antecedencia-minima-minutos=30
autoescola.agendamento.max-instrucoes-por-aluno-dia=2
autoescola.cancelamento.antecedencia-minima-horas=24

springdoc.swagger-ui.path=/swagger-ui.html
