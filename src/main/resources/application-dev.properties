# Perfil padrao: H2 em memoria. Sobe zerado a cada restart, sem precisar de
# nenhuma infraestrutura externa - ideal para rodar e avaliar rapidamente.
server.port=8080

spring.datasource.url=jdbc:h2:mem:autoescola;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
